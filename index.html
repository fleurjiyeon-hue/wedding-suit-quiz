<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신랑 예복 스타일 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F8F4EF;
    --ivory: #F2EDE6;
    --dark: #1C1917;
    --mid: #57534E;
    --muted: #A8A29E;
    --border: rgba(28,25,23,0.12);
    --accent: #1C1917;
    --serif: 'Noto Serif KR', serif;
    --sans: 'Noto Sans KR', sans-serif;
  }

  html, body {
    min-height: 100%;
    background: var(--cream);
    font-family: var(--sans);
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
  }

  .top-bar {
    width: 100%;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid var(--border);
    background: var(--cream);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .brand {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--dark);
  }

  .q-counter {
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  .progress-track {
    width: 100%;
    height: 2px;
    background: var(--border);
  }
  .progress-fill {
    height: 2px;
    background: var(--dark);
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  .main {
    width: 100%;
    max-width: 480px;
    padding: 48px 24px 80px;
    min-height: calc(100vh - 62px);
    display: flex;
    flex-direction: column;
  }

  .intro-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    animation: fadeUp 0.6s ease both;
  }

  .intro-eyebrow {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .intro-title {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--dark);
    margin-bottom: 20px;
  }

  .intro-desc {
    font-size: 14px;
    color: var(--mid);
    line-height: 1.9;
    margin-bottom: 40px;
    font-weight: 300;
  }

  .intro-meta {
    display: flex;
    gap: 24px;
    margin-bottom: 48px;
  }
  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .meta-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .meta-value {
    font-size: 14px;
    font-weight: 500;
    color: var(--dark);
  }

  .btn-start {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--dark);
    color: var(--cream);
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-start:hover { opacity: 0.85; }

  .quiz-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.4s ease both;
  }

  .q-number {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
    font-weight: 300;
  }

  .q-text {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--dark);
    margin-bottom: 40px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    margin-bottom: 32px;
  }

  .opt {
    padding: 18px 20px;
    border: 0.5px solid var(--border);
    background: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .opt::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: var(--dark);
    transition: width 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  .opt:hover { border-color: rgba(28,25,23,0.3); }
  .opt.selected { border-color: var(--dark); }
  .opt.selected::before { width: 3px; }

  .opt-key {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.08em;
    width: 16px;
    flex-shrink: 0;
    transition: color 0.2s;
  }
  .opt.selected .opt-key { color: var(--dark); }

  .opt-text {
    font-size: 14px;
    color: var(--dark);
    line-height: 1.6;
    font-weight: 300;
  }

  .nav {
    display: flex;
    gap: 10px;
  }

  .btn-back {
    padding: 14px 20px;
    border: 0.5px solid var(--border);
    background: transparent;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--mid);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-back:hover { border-color: var(--dark); color: var(--dark); }

  .btn-next {
    flex: 1;
    padding: 14px;
    background: var(--dark);
    color: var(--cream);
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    letter-spacing: 0.03em;
  }
  .btn-next:disabled { opacity: 0.25; cursor: default; }
  .btn-next:not(:disabled):hover { opacity: 0.85; }

  .result-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.5s ease both;
  }

  .result-eyebrow {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .result-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 14px;
    letter-spacing: 0.05em;
    margin-bottom: 16px;
    border: 0.5px solid var(--dark);
    color: var(--dark);
  }

  .result-title {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--dark);
    margin-bottom: 14px;
  }

  .result-desc {
    font-size: 14px;
    color: var(--mid);
    line-height: 1.9;
    margin-bottom: 36px;
    font-weight: 300;
    padding-bottom: 36px;
    border-bottom: 0.5px solid var(--border);
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .style-list {
    list-style: none;
    margin-bottom: 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .style-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .style-item:last-child { border-bottom: none; }

  .style-num {
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
    padding-top: 3px;
    width: 16px;
    flex-shrink: 0;
  }

  .style-text {
    font-size: 14px;
    color: var(--dark);
    line-height: 1.7;
    font-weight: 300;
  }

  .fabric-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 40px;
    padding: 20px;
    background: var(--ivory);
  }

  .fabric-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
    color: var(--mid);
    line-height: 1.6;
    font-weight: 300;
  }
  .fabric-dash { color: var(--muted); }

  .cta-block {
    background: var(--dark);
    padding: 28px 24px;
    margin-bottom: 16px;
  }
  .cta-title {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 600;
    color: var(--cream);
    margin-bottom: 8px;
  }
  .cta-sub {
    font-size: 13px;
    color: rgba(248,244,239,0.6);
    line-height: 1.7;
    margin-bottom: 20px;
    font-weight: 300;
  }
  .cta-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: var(--cream);
    color: var(--dark);
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.03em;
    text-align: center;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .cta-btn:hover { opacity: 0.85; }

  .btn-retry {
    display: block;
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 0.5px solid var(--border);
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .btn-retry:hover { border-color: var(--dark); color: var(--dark); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand">BESPOKE QUIZ</div>
  <div class="q-counter" id="counter"></div>
</div>
<div class="progress-track">
  <div class="progress-fill" id="progress" style="width:0%"></div>
</div>

<div class="main">
  <!-- 인트로 -->
  <div class="intro-screen" id="intro">
    <div class="intro-eyebrow">Wedding Style Diagnosis</div>
    <h1 class="intro-title">나에게 어울리는<br>예복 스타일은?</h1>
    <p class="intro-desc">
      드레스를 고르듯, 예복도 나다움에서 시작해요.<br>
      5가지 질문으로 신랑님의 스타일 유형을 찾아드려요.
    </p>
    <div class="intro-meta">
      <div class="meta-item">
        <span class="meta-label">소요시간</span>
        <span class="meta-value">약 2분</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">질문 수</span>
        <span class="meta-value">5개</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">결과 유형</span>
        <span class="meta-value">4가지</span>
      </div>
    </div>
    <button class="btn-start" onclick="startQuiz()">진단 시작하기</button>
  </div>

  <!-- 퀴즈 -->
  <div class="quiz-screen hidden" id="quiz">
    <div class="q-number" id="qnum"></div>
    <div class="q-text" id="qtext"></div>
    <div class="options" id="opts"></div>
    <div class="nav">
      <button class="btn-back" id="back-btn" onclick="goBack()">이전</button>
      <button class="btn-next" id="next-btn" disabled onclick="goNext()">다음</button>
    </div>
  </div>

  <!-- 결과 -->
  <div class="result-screen hidden" id="result"></div>
</div>

<script>
const questions = [
  {
    q: "결혼식 장소 분위기가 어떤 편인가요?",
    opts: [
      "웅장하고 클래식한 대형 웨딩홀",
      "자연광이 가득한 가든·야외 웨딩",
      "세련되고 모던한 하우스 웨딩",
      "아늑하고 감성적인 소규모 홀"
    ]
  },
  {
    q: "평소 옷을 고를 때 나는?",
    opts: [
      "단정하고 깔끔한 스타일을 선호해요",
      "유행보다는 편안함을 중시해요",
      "트렌디하고 개성 있는 걸 좋아해요",
      "무드에 따라 자유롭게 선택해요"
    ]
  },
  {
    q: "신부 드레스 컨셉이 어떤 편인가요?",
    opts: [
      "볼륨감 있는 클래식 볼 가운",
      "심플하고 라인이 살아있는 A라인",
      "미니멀하고 세련된 슬림 드레스",
      "아직 정하지 않았어요"
    ]
  },
  {
    q: "결혼식 날 사진에서 어떤 느낌으로 남고 싶나요?",
    opts: [
      "믿음직스럽고 단단한 신랑",
      "자연스럽고 따뜻한 신랑",
      "감각 있고 세련된 신랑",
      "부드럽고 로맨틱한 신랑"
    ]
  },
  {
    q: "예복에서 가장 중요하게 생각하는 것은?",
    opts: [
      "어깨·허리 핏이 딱 잡히는 실루엣",
      "움직임이 편하고 자연스러운 착용감",
      "원단 질감과 컬러의 고급스러움",
      "신부 드레스와의 전체적인 조화"
    ]
  }
];

const typeMap = [
  ["classic","natural","modern","romantic"],
  ["classic","natural","modern","romantic"],
  ["classic","natural","modern","classic"],
  ["classic","natural","modern","romantic"],
  ["classic","natural","modern","romantic"]
];

const types = {
  classic: {
    badge: "클래식 포멀",
    title: "클래식 포멀형",
    desc: "신뢰감과 품격이 느껴지는 스타일이에요. 단정한 라인과 전통적인 실루엣으로 웨딩홀의 웅장함과 자연스럽게 어우러져요. 하객들에게 믿음직한 첫인상을 남기는 타입입니다.",
    styles: [
      "네이비·차콜 싱글 브레스트 수트",
      "넓은 라펠과 깔끔하게 잡힌 어깨 라인",
      "클래식 화이트 셔츠 + 실크 넥타이 조합"
    ],
    fabrics: [
      "울 혼방 소재로 고급스러운 질감",
      "무광 원단으로 절제된 포멀함 표현"
    ]
  },
  natural: {
    badge: "내추럴 로맨틱",
    title: "내추럴 로맨틱형",
    desc: "자연스럽고 따뜻한 분위기가 잘 어울려요. 편안한 착용감 속에 로맨틱한 감성이 느껴지는 스타일로, 가든·야외 웨딩에서 특히 빛나는 타입입니다.",
    styles: [
      "베이지·그레이 계열 소프트 수트",
      "살짝 여유 있는 실루엣으로 자연스러운 무드",
      "플로럴 또는 텍스처 넥타이로 부드러운 포인트"
    ],
    fabrics: [
      "리넨 혼방 소재로 부드럽고 가벼운 질감",
      "봄·여름 웨딩에 특히 잘 어울리는 원단"
    ]
  },
  modern: {
    badge: "모던 센슈얼",
    title: "모던 센슈얼형",
    desc: "감각적이고 세련된 스타일이에요. 트렌디한 디테일과 슬림한 실루엣으로 하우스 웨딩이나 소규모 웨딩에서 특히 강한 인상을 남기는 타입입니다.",
    styles: [
      "슬림 핏 수트로 날렵하고 모던한 실루엣",
      "다크 네이비·블랙 계열 모노톤 코디",
      "포켓 스퀘어·브로치로 포인트 디테일"
    ],
    fabrics: [
      "스트레치 소재로 핏과 편안함을 동시에",
      "은은한 광택감 있는 원단으로 세련된 느낌"
    ]
  },
  romantic: {
    badge: "소프트 엘레강스",
    title: "소프트 엘레강스형",
    desc: "부드럽고 로맨틱한 분위기를 자아내는 스타일이에요. 신부 드레스와의 조화를 가장 중요하게 생각하며, 두 분이 함께 사진 찍혔을 때 전체 그림이 가장 아름다운 타입입니다.",
    styles: [
      "라이트 그레이·아이보리 계열 수트",
      "드레스 컬러와 매칭되는 넥타이·포켓 스퀘어",
      "버튼홀 플라워로 로맨틱한 디테일 완성"
    ],
    fabrics: [
      "부드러운 울 소재로 따뜻하고 우아한 질감",
      "신부 드레스 원단과 컬러 밸런스 맞춤 매칭"
    ]
  }
};

let current = 0;
let answers = [];

function startQuiz() {
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('qnum').textContent = `Question ${String(current+1).padStart(2,'0')} / ${questions.length}`;
  document.getElementById('qtext').textContent = q.q;
  document.getElementById('counter').textContent = `${current + 1} / ${questions.length}`;
  document.getElementById('progress').style.width = `${((current) / questions.length) * 100}%`;
  document.getElementById('back-btn').style.display = current === 0 ? 'none' : 'block';
  document.getElementById('next-btn').textContent = current === questions.length - 1 ? '결과 보기' : '다음';
  document.getElementById('next-btn').disabled = answers[current] === undefined;

  const opts = document.getElementById('opts');
  opts.innerHTML = q.opts.map((o, i) => `
    <button class="opt ${answers[current] === i ? 'selected' : ''}" onclick="selectOpt(${i})">
      <span class="opt-key">${['A','B','C','D'][i]}</span>
      <span class="opt-text">${o}</span>
    </button>
  `).join('');

  document.getElementById('quiz').style.animation = 'none';
  requestAnimationFrame(() => {
    document.getElementById('quiz').style.animation = 'fadeUp 0.35s ease both';
  });
}

function selectOpt(i) {
  answers[current] = i;
  document.querySelectorAll('.opt').forEach((b, idx) => {
    b.classList.toggle('selected', idx === i);
  });
  document.getElementById('next-btn').disabled = false;
}

function goNext() {
  if (answers[current] === undefined) return;
  current++;
  if (current >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function goBack() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function showResult() {
  const scores = { classic: 0, natural: 0, modern: 0, romantic: 0 };
  answers.forEach((a, qi) => { scores[typeMap[qi][a]]++; });
  const top = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  const t = types[top];

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('counter').textContent = '완료';
  document.getElementById('progress').style.width = '100%';

  const res = document.getElementById('result');
  res.classList.remove('hidden');
  res.innerHTML = `
    <div class="result-eyebrow">Your Style Type</div>
    <div class="result-badge">${t.badge}</div>
    <h2 class="result-title">${t.title}</h2>
    <p class="result-desc">${t.desc}</p>

    <div class="section-label">추천 스타일</div>
    <ul class="style-list">
      ${t.styles.map((s, i) => `
        <li class="style-item">
          <span class="style-num">0${i+1}</span>
          <span class="style-text">${s}</span>
        </li>
      `).join('')}
    </ul>

    <div class="section-label">어울리는 원단</div>
    <div class="fabric-grid">
      ${t.fabrics.map(f => `
        <div class="fabric-item">
          <span class="fabric-dash">—</span>
          <span>${f}</span>
        </div>
      `).join('')}
    </div>

    <div class="cta-block">
      <div class="cta-title">직접 입어보고 싶으신가요?</div>
      <div class="cta-sub">진단 결과를 바탕으로 딱 맞는 샘플을<br>미리 준비해드려요. 부담 없이 문의해 주세요.</div>
      <a class="cta-btn" href="https://open.kakao.com" target="_blank">카카오톡 상담 문의하기</a>
    </div>
    <button class="btn-retry" onclick="restart()">다시 진단하기</button>
  `;
}

function restart() {
  current = 0;
  answers = [];
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('counter').textContent = '1 / 5';
  renderQuestion();
}
</script>
</body>
</html>
